name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Verify Java 8
        run: java -version
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify distribution
        run: |
          test -s target/hdfs-perf-inspector-0.1.0-linux-x86_64.tar.gz
          tar -tzf target/hdfs-perf-inspector-0.1.0-linux-x86_64.tar.gz
          unzip -t target/hdfs-perf-inspector-0.1.0-linux-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hdfs-perf-inspector-0.1.0-linux-x86_64
          path: |
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.tar.gz
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.zip
            target/hdfs-perf-inspector-0.1.0.jar
          if-no-files-found: error
      - name: Check v0.1.0 release
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create v0.1.0 tag and release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.sha }}
          name: HDFS Performance Inspector 0.1.0
          generate_release_notes: true
          files: |
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.tar.gz
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.zip
            target/hdfs-perf-inspector-0.1.0.jar
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.tar.gz
            target/hdfs-perf-inspector-0.1.0-linux-x86_64.zip
            target/hdfs-perf-inspector-0.1.0.jar
